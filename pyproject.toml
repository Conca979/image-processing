[project]
name = "image-processing"
version = "0.1.0"
description = "General Image Processing and Computer Vision Toolkit"
readme = "README.md"
authors = [
    { name = "Duong", email = "tn7956666@gail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pillow>=12.3.0",
]

[project.scripts]
image-processing = "image_processing.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
